name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Assemble app
        run: Scripts/build-app.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/Troy.app build/Troy.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Troy.app
          path: build/Troy.zip
